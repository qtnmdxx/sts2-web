name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages deployment needs pages: write (publish the artifact) and
# id-token: write (let deploy-pages exchange an OIDC token).
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, in push order; a newer push queues behind the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Must run before setup-node so `cache: pnpm` can find the pnpm store.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The site is generated by packages/wiki/src/build.ts, not by `vite build`.
      # Pages are written with a relative <base href>, so the site works under the
      # /sts2-web/ subpath without any base-path setting. WIKI_ORIGIN only feeds the
      # canonical/alternate links and sitemap.xml.
      - name: Build
        run: pnpm build
        env:
          WIKI_ORIGIN: https://qtnmdxx.github.io/sts2-web

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Build output: packages/wiki/dist (wiki/ pages, assets/, root redirect).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/wiki/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
